<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e52b1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STRIDE" />
    <meta name="description" content="Sunlit first-person parkour speedrunner." />
    <title>STRIDE</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-512.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./icons/icon-192.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='14,54 34,10 50,10 30,54' fill='%23e62e1f'/%3E%3Cpolygon points='34,54 46,28 56,28 44,54' fill='%23111418'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <canvas id="fx-canvas"></canvas>
      <div id="ui-root">
        <div class="menu-screen" id="boot-menu">
          <div class="brand">
            <span class="brand-slash"></span>
            <h1 class="brand-title">STRIDE</h1>
          </div>
          <p class="boot-msg">LOADING</p>
        </div>
      </div>
      <div id="touch-root"></div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        });
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
